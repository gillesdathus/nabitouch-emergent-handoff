name: nabitouch-codex-qa
services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { if (rs.status().ok !== 1) quit(1) } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1) }"]
      interval: 3s
      timeout: 5s
      retries: 40
    networks: [qa]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [qa]
  qa:
    build:
      context: ../..
      dockerfile: deploy/qa/Dockerfile
    volumes:
      - ../..:/app
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [qa]
networks:
  qa:
    internal: true
