log_format staging_redacted '$request_method $status $body_bytes_sent $request_time';
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log staging_redacted;
    # Default Nginx errors can include the complete address query or bearer link.
    # Monitor status/latency above and container/API health instead.
    error_log /dev/null;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { try_files $uri $uri/ /index.html; }
}
