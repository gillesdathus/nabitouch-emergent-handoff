# Preparation only. Install only after HTTPS/DNS and deployment authorization.
# Choose a dedicated staging vhost. Never replace the production site's configuration.
server {
    listen 443 ssl;
    server_name staging.example.com;
    ssl_certificate /etc/nabitouch-staging/https/fullchain.pem;
    ssl_certificate_key /etc/nabitouch-staging/https/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        # Replace with approved tester/VPN CIDRs before activation.
        allow 192.0.2.0/24;
        deny all;
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Provider callbacks cannot use the tester VPN. Only these signed endpoints are public.
    location = /api/billing/stripe/webhook { proxy_pass http://127.0.0.1:18081; proxy_set_header Host $host; }
    location = /api/notifications/resend { proxy_pass http://127.0.0.1:18081; proxy_set_header Host $host; }
}
