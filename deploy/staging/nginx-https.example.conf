# Preparation only. Install only after HTTPS/DNS and deployment authorization.
# Choose a dedicated staging vhost. Never replace the production site's configuration.
log_format nabitouch_staging_edge '$request_method $status $body_bytes_sent $request_time';
server {
    listen 443 ssl;
    server_name staging.nabitouch.com;
    ssl_certificate /etc/nabitouch-staging/https/fullchain.pem;
    ssl_certificate_key /etc/nabitouch-staging/https/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/nabitouch-staging.access.log nabitouch_staging_edge;
    error_log /dev/null;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location / {
        # Owner selected an authentication gate. Create a staging-only htpasswd
        # file outside Git, mode 0640, readable by Nginx's group.
        auth_basic "Nabitouch staging";
        auth_basic_user_file /etc/nabitouch-staging/testers.htpasswd;
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 443 ssl;
    server_name api-staging.nabitouch.com;
    # Certificate must include BOTH staging names. Do not use the production private key.
    ssl_certificate /etc/nabitouch-staging/https/fullchain.pem;
    ssl_certificate_key /etc/nabitouch-staging/https/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/nabitouch-staging.access.log nabitouch_staging_edge;
    error_log /dev/null;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # Provider callbacks cannot use the tester VPN. Only signed endpoints are public.
    location = /api/billing/stripe/webhook {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/notifications/resend {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        auth_basic "Nabitouch staging";
        auth_basic_user_file /etc/nabitouch-staging/testers.htpasswd;
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
